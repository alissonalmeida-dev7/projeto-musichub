<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - MusicHub</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="../style/global.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="layout">
        <header class="cabecalho">
            <a href="#" class="logo">MusicHUB</a>

            <div class="busca">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="O que você busca?">
            </div>

            <div class="acoes">
                <button class="icone-btn" aria-label="Notificações"><i class="fa-solid fa-bell"></i></button>
                <button class="icone-btn avatar" aria-label="Perfil"><i class="fa-solid fa-circle-user"></i></button>
            </div>
        </header>

        <nav class="menu-lateral-esquerdo">
            <a href="#" class="ativo" aria-label="Início"><i class="fa-solid fa-house"></i></a>
            <a href="#" aria-label="Explorar"><i class="fa-regular fa-compass"></i></a>
            <a href="#" aria-label="Favoritos"><i class="fa-regular fa-heart"></i></a>
            <a href="#" aria-label="Playlists"><i class="fa-solid fa-music"></i></a>
            <hr>
            <a href="#" aria-label="Configurações"><i class="fa-solid fa-gear"></i></a>
            <a href="#" aria-label="Sair"><i class="fa-solid fa-right-from-bracket"></i></a>
        </nav>

        <main class="conteudo-principal">

            <section class="banner">
                <h2 class="banner-chamada">NAVEGUE NOS <span>MELHORES</span> SONS</h2>

                <div class="banner-carrossel">
                    <button class="banner-seta esquerda" aria-label="Anterior">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>

                    <div class="banner-slides">
                        <div class="banner-slide ativo" data-titulo="SERTANEJO">
                            <img src="../img/sertanejo.jpg" alt="Sertanejo">
                        </div>
                        <div class="banner-slide" data-titulo="TRAP">
                            <img src="../img/trap.jpg" alt="Trap">
                        </div>
                        <div class="banner-slide" data-titulo="POP">
                            <img src="../img/pop.jpg" alt="Pop">
                        </div>
                    </div>

                    <button class="banner-seta direita" aria-label="Próximo">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>

                <p class="banner-titulo">SERTANEJO</p>
            </section>

        </main>
    </div>

</body>

</html>
