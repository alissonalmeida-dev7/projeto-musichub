<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MusicHub</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../style/global.css">
    <link rel="shortcut icon" href="../imgs/Logo_superior_esquerdo-MusicHub.svg" type="image/x-icon">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">

</head>

<body>
    <header class="cabecalho-login">
        <a href="../home/home.html" class="logo">
            <img src="../imgs/Logo_superior_esquerdo-MusicHub.svg" alt="MusicHub">
            <span>MusicHUB</span>
        </a>

        <div class="acoes">
            <a href="../home/home.html" class="home-icone"><img src="../imgs/home.svg" alt="Home"></a>
        </div>
    </header>

    <main class="conteudo">
        <section class="login">
            <div class="login-cabecalho">
                <h1>Bem vindo(a) ao MusicHUB</h1>
                <p>Acesse sua conta para continuar</p>
            </div>
            <form>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input required type="email" id="email" placeholder="email@alunosenai.com">
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <div class="campo-senha">
                        <input required type="password" id="senha" placeholder="*********">
                        <button type="button" id="mostrar-senha" class="botao-olho" aria-label="Mostrar senha">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-eye">
                                <path
                                    d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="botao-entrar">Entrar</button>
                <button type="button" class="botao-google">
                    <img src="../imgs/logos_google-icon.svg" alt="Logo Google">
                    <span>Continuar com Google</span>
                </button>
            </form>
        </section>
    </main>

    <script src="login.js"></script>
</body>

</html>
